{% extends "base.html" %}
{% load static %}
{% block title %}static page{% endblock title %}


{% block content %}
    <section class="container my-4 py-4">
        <div class="row">
            <div class="col-lg-10 offset-lg-1">
                <h1 class="mb-4 fw-bold text-center">{{ page_title }}</h1>
                
                <div class="static-content-body">
                    {{ page_content|safe }}
                </div>
            </div>
        </div>
    </section>
{% endblock content %}
    {% block extra_js %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% endblock extra_js %}
