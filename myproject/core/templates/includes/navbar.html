{% load static %}
<nav class="navbar navbar-expand-lg py-3 fixed-top">
    <div class="container">

        <!-- Logo -->
        <a class="navbar-brand" href="{% url 'home' %}">
            {% if site_settings.navbar_logo.url %}
                <img src="{{ site_settings.navbar_logo.url }}" alt="{{ site_name|default:'Brand-Image' }}" height="55">
            {% endif %}
        </a>

        <!-- Toggler -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Collapsible Menu -->
        <div class="collapse navbar-collapse" id="navMenu">

            <!-- Center Navigation -->
            <ul class="navbar-nav mx-auto gap-3 ">
                <li class="nav-item"><a class="nav-link fw-semibold {% if request.resolver_match.url_name == 'home' %}nav-active{% endif %}"   href="{% url 'home' %}">Home</a></li>
                <li class="nav-item"><a class="nav-link fw-semibold {% if request.resolver_match.url_name == 'products' %}nav-active{% endif %} " href="{% url 'products' %}">Products</a></li>
                <li class="nav-item"><a class="nav-link fw-semibold {% if request.resolver_match.url_name == 'about' %}nav-active{% endif %} " href="{% url 'about' %}">About Us</a></li>
                <li class="nav-item"><a class="nav-link fw-semibold {% if request.resolver_match.url_name == 'contact' %}nav-active{% endif %} " href="{% url 'contact' %}">Contact Us</a></li>
            </ul>

            <!-- Right side icons -->
            <div class="d-flex gap-3 nav-phone-search ms-lg-4 mt-3 mt-lg-0 justify-content-center">
                <i class="bi bi-search search-icon"></i>
                <div class="d-flex align-items-center">
                    <i class="bi bi-telephone phone-icon-1 me-1"></i>
                    {{site_settings.phone}}
                </div>
            </div>

        </div>

    </div>
</nav>
